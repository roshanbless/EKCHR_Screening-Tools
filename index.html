<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> EKC HR Screening Desk — ATS </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#232323; --charcoal:#2E2A26; --paper:#FAF7F2; --white:#FFFFFF;
    --gold:#A9752B; --gold-bg:#F5EBDA; --line:#E4DFD5;
    --muted:#8A8378; --muted-2:#5C574D;
    --strong:#2F7D5C; --strong-bg:#E5F1EA;
    --moderate:#A9752B; --moderate-bg:#F5EBDA;
    --weak:#B4453A; --weak-bg:#F7E9E7;
    --shadow-sm:0 1px 2px rgba(35,35,35,0.07);
    --shadow-md:0 6px 20px rgba(35,35,35,0.10);
    --shadow-lg:0 16px 40px rgba(35,35,35,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;padding:32px 24px 90px;}
  .wrap{max-width:1220px;margin:0 auto;}

  .masthead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .masthead h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;letter-spacing:-0.01em;margin:0;color:var(--charcoal);}
  .masthead .docket{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .masthead .subtitle{font-size:13.5px;color:var(--muted-2);margin-top:4px;}

  .layout{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start;}
  @media (max-width:920px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px 20px 22px;box-shadow:var(--shadow-sm);}
  .panel + .panel{margin-top:18px;}
  .panel h3{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 14px;color:var(--charcoal);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,117,43,0.14);background:var(--white);}
  .field textarea{min-height:80px;resize:vertical;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4;}

  .btn-primary{background:var(--charcoal);color:var(--white);border:none;padding:10px 18px;border-radius:6px;font-weight:600;font-size:13.5px;cursor:pointer;width:100%;transition:background .15s;}
  .btn-primary:hover{background:#1c1a17;}
  .btn-secondary{background:var(--white);color:var(--charcoal);border:1px solid var(--line);padding:9px 16px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-secondary:hover{border-color:var(--muted);}

  .job-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .job-chip{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-size:13px;}
  .job-chip.active{background:var(--gold-bg);border-color:var(--gold);}
  .job-chip .jc-name{font-weight:600;color:var(--charcoal);}
  .job-chip .jc-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .job-chip .jc-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px;}
  .job-chip .jc-del:hover{color:var(--weak);}

  .dropzone{border:1.5px dashed var(--line);border-radius:8px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--paper);transition:border-color .15s,background .15s;}
  .dropzone:hover,.dropzone.drag{border-color:var(--gold);background:var(--gold-bg);}
  .dropzone svg{color:var(--muted);margin-bottom:6px;}
  .dropzone p{margin:0;font-size:12.5px;color:var(--muted-2);}
  .dropzone .dz-sub{font-size:11px;color:var(--muted);margin-top:3px;}

  .upload-status{margin-top:10px;font-size:12px;color:var(--muted-2);}
  .upload-status .line{display:flex;justify-content:space-between;padding:4px 0;}

  /* ---- toolbar ---- */
  .toolbar{display:flex;gap:12px;margin-bottom:16px;align-items:center;}
  .search-box{flex:1;position:relative;}
  .search-box input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--white);}
  .search-box input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,117,43,0.12);}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .tier-pills{display:flex;gap:6px;}
  .pill{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:12.5px;font-weight:600;color:var(--muted-2);cursor:pointer;white-space:nowrap;}
  .pill.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--white);}

  /* ---- ledger / candidate cards ---- */
  .ledger{display:flex;flex-direction:column;gap:12px;}
  .candidate{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:18px 20px;box-shadow:var(--shadow-sm);}
  .cand-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .cand-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--charcoal);}
  .cand-file{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px;}

  .score-meter{display:flex;flex-direction:column;align-items:flex-end;min-width:120px;}
  .score-num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;line-height:1;}
  .score-num.strong{color:var(--strong);}
  .score-num.moderate{color:var(--moderate);}
  .score-num.weak{color:var(--weak);}
  .score-track{width:120px;height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
  .score-fill{height:100%;border-radius:3px;}
  .score-fill.strong{background:var(--strong);}
  .score-fill.moderate{background:var(--moderate);}
  .score-fill.weak{background:var(--weak);}

  .chip-rows{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chip-row .cr-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);width:64px;flex-shrink:0;}
  .kw-chip{font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .kw-chip.matched{background:var(--strong-bg);color:var(--strong);}
  .kw-chip.missing{background:var(--line);color:var(--muted-2);}

  .cand-toggle{margin-top:12px;background:none;border:none;color:var(--gold);font-size:12px;font-weight:600;cursor:pointer;padding:0;}
  .cand-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted-2);line-height:1.6;max-height:220px;overflow-y:auto;white-space:pre-wrap;display:none;}
  .cand-body.open{display:block;}
  .cand-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;margin-top:10px;}
  .cand-del:hover{color:var(--weak);}

  .empty-state{padding:64px 20px;text-align:center;color:var(--muted);background:var(--white);border:1px solid var(--line);border-radius:9px;}
  .empty-state .glyph{font-family:'Fraunces',serif;font-size:38px;color:var(--line);margin-bottom:8px;}
  .empty-state p{font-size:14px;margin:4px 0 0;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:var(--white);padding:12px 22px;border-radius:6px;font-size:13.5px;font-weight:500;opacity:0;transition:all .2s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div style="display:flex;align-items:baseline;gap:12px;">
        <h1>EKC Screening Desk</h1>
        <span class="docket">ATS</span>
      </div>
      <div class="subtitle">Set what the role requires. See who clears the bar.</div>
    </div>
  </div>

  <div class="layout">
    <!-- LEFT COLUMN -->
    <div>
      <div class="panel">
        <h3>Requirement Profiles</h3>
        <div class="job-list" id="jobList"></div>
        <button class="btn-secondary" id="newJobBtn" style="width:100%;">+ New Requirement Profile</button>
      </div>

      <div class="panel" id="reqEditor" style="display:none;">
        <h3 id="reqEditorTitle">Requirement Details</h3>
        <div class="field">
          <label>Job Title</label>
          <input type="text" id="f_jobTitle" placeholder="e.g. Network Administrator">
        </div>
        <div class="field">
          <label>Required Skills / Keywords</label>
          <textarea id="f_keywords" placeholder="e.g. Windows Server, Azure, Cisco, SonicWall, Active Directory"></textarea>
          <div class="hint">Comma-separated. Candidates are scored on how many of these appear in their resume.</div>
        </div>
        <button class="btn-primary" id="saveJobBtn">Save Profile</button>
      </div>

      <div class="panel">
        <h3>Upload Resumes</h3>
        <div class="dropzone" id="dropzone">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>Drop PDF or .txt resumes here</p>
          <div class="dz-sub">or click to browse — multiple files supported</div>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.txt" multiple style="display:none;">
        <div class="upload-status" id="uploadStatus"></div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div>
      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search candidates by name or file…">
        </div>
        <div class="tier-pills" id="tierPills"></div>
      </div>
      <div class="ledger" id="ledger"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const JOBS_KEY = 'requirement_profiles';
  const CANDS_KEY = 'candidates';

  let jobs = [];
  let candidates = [];
  let activeJobId = null;
  let editingJobId = null;
  let activeTier = 'All';
  let searchTerm = '';
  let expanded = {};

  function uid(p){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  async function loadAll(){
    try {
      const r = await window.storage.get(JOBS_KEY, false);
      jobs = r && r.value ? JSON.parse(r.value) : [];
    } catch(e){ jobs = []; }
    try {
      const r2 = await window.storage.get(CANDS_KEY, false);
      candidates = r2 && r2.value ? JSON.parse(r2.value) : [];
    } catch(e){ candidates = []; }
    if(jobs.length && !activeJobId) activeJobId = jobs[0].id;
    render();
  }

  async function persistJobs(){
    try { await window.storage.set(JOBS_KEY, JSON.stringify(jobs), false); }
    catch(e){ showToast('Could not save requirement profiles'); }
  }
  async function persistCandidates(){
    try { await window.storage.set(CANDS_KEY, JSON.stringify(candidates), false); }
    catch(e){ showToast('Could not save candidates'); }
  }

  function activeJob(){ return jobs.find(j=>j.id === activeJobId) || null; }

  function parseKeywords(str){
    return str.split(',').map(s=>s.trim()).filter(Boolean);
  }

  function scoreCandidate(cand, job){
    if(!job || !job.keywords.length) return { pct:0, matched:[], missing: job ? job.keywords : [] };
    const text = (cand.text || '').toLowerCase();
    const matched = [], missing = [];
    job.keywords.forEach(kw=>{
      if(text.includes(kw.toLowerCase())) matched.push(kw); else missing.push(kw);
    });
    const pct = Math.round((matched.length / job.keywords.length) * 100);
    return { pct, matched, missing };
  }

  function tierOf(pct){
    if(pct >= 70) return 'strong';
    if(pct >= 40) return 'moderate';
    return 'weak';
  }

  // ---------- Rendering ----------
  function render(){
    renderJobList();
    renderReqEditor();
    renderTierPills();
    renderLedger();
  }

  function renderJobList(){
    const el = document.getElementById('jobList');
    if(jobs.length === 0){
      el.innerHTML = `<div style="font-size:12.5px;color:var(--muted);padding:6px 2px;">No requirement profiles yet.</div>`;
      return;
    }
    el.innerHTML = jobs.map(j=>{
      const count = candidates.filter(c=>c.jobId === j.id).length;
      return `<div class="job-chip ${j.id===activeJobId?'active':''}" data-id="${j.id}">
        <div><div class="jc-name">${escapeHtml(j.title)}</div></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="jc-count">${count}</span>
          <button class="jc-del" data-id="${j.id}" title="Delete profile">&times;</button>
        </div>
      </div>`;
    }).join('');
    el.querySelectorAll('.job-chip').forEach(chip=>{
      chip.addEventListener('click', (e)=>{
        if(e.target.classList.contains('jc-del')) return;
        activeJobId = chip.dataset.id;
        render();
      });
    });
    el.querySelectorAll('.jc-del').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        jobs = jobs.filter(j=>j.id !== id);
        candidates = candidates.filter(c=>c.jobId !== id);
        if(activeJobId === id) activeJobId = jobs.length ? jobs[0].id : null;
        await persistJobs(); await persistCandidates();
        render();
      });
    });
  }

  function renderReqEditor(){
    const panel = document.getElementById('reqEditor');
    if(editingJobId === null){ panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    const job = editingJobId === 'new' ? null : jobs.find(j=>j.id === editingJobId);
    document.getElementById('reqEditorTitle').textContent = job ? 'Edit Requirement Profile' : 'New Requirement Profile';
    document.getElementById('f_jobTitle').value = job ? job.title : '';
    document.getElementById('f_keywords').value = job ? job.keywords.join(', ') : '';
  }

  function renderTierPills(){
    const tiers = ['All','Strong match','Moderate','Weak'];
    document.getElementById('tierPills').innerHTML = tiers.map(t=>
      `<button class="pill ${t===activeTier?'active':''}" data-tier="${t}">${t}</button>`
    ).join('');
    document.querySelectorAll('.tier-pills .pill').forEach(p=>{
      p.addEventListener('click', ()=>{ activeTier = p.dataset.tier; renderLedger(); });
    });
  }

  function tierMatches(tier, pct){
    if(tier === 'All') return true;
    if(tier === 'Strong match') return pct >= 70;
    if(tier === 'Moderate') return pct >= 40 && pct < 70;
    if(tier === 'Weak') return pct < 40;
    return true;
  }

  function renderLedger(){
    const job = activeJob();
    const container = document.getElementById('ledger');
    if(!job){
      container.innerHTML = `<div class="empty-state"><div class="glyph">—</div><p>Create a requirement profile to start screening resumes.</p></div>`;
      return;
    }
    let list = candidates.filter(c=>c.jobId === job.id);
    list = list.filter(c=>{
      const s = !searchTerm || c.name.toLowerCase().includes(searchTerm) || c.fileName.toLowerCase().includes(searchTerm);
      return s;
    });
    const scored = list.map(c=>({ cand:c, ...scoreCandidate(c, job) }));
    const filtered = scored.filter(s=>tierMatches(activeTier, s.pct));
    filtered.sort((a,b)=>b.pct - a.pct);

    if(filtered.length === 0){
      container.innerHTML = `<div class="empty-state"><div class="glyph">—</div><p>${list.length===0 ? 'No resumes uploaded for this profile yet.' : 'No candidates match this filter.'}</p></div>`;
      return;
    }

    container.innerHTML = filtered.map(({cand, pct, matched, missing})=>{
      const tier = tierOf(pct);
      const isOpen = expanded[cand.id];
      return `
      <div class="candidate">
        <div class="cand-top">
          <div>
            <div class="cand-name">${escapeHtml(cand.name)}</div>
            <div class="cand-file">${escapeHtml(cand.fileName)}</div>
          </div>
          <div class="score-meter">
            <div class="score-num ${tier}">${pct}%</div>
            <div class="score-track"><div class="score-fill ${tier}" style="width:${pct}%;"></div></div>
          </div>
        </div>
        <div class="chip-rows">
          ${matched.length ? `<div class="chip-row"><span class="cr-label">Matched</span>${matched.map(k=>`<span class="kw-chip matched">${escapeHtml(k)}</span>`).join('')}</div>` : ''}
          ${missing.length ? `<div class="chip-row"><span class="cr-label">Missing</span>${missing.map(k=>`<span class="kw-chip missing">${escapeHtml(k)}</span>`).join('')}</div>` : ''}
        </div>
        <button class="cand-toggle" data-id="${cand.id}">${isOpen ? 'Hide resume text' : 'View resume text'}</button>
        <div class="cand-body ${isOpen ? 'open':''}">${escapeHtml(cand.text).slice(0,4000)}</div>
        <div><button class="cand-del" data-id="${cand.id}">Remove candidate</button></div>
      </div>`;
    }).join('');

    container.querySelectorAll('.cand-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        expanded[id] = !expanded[id];
        renderLedger();
      });
    });
    container.querySelectorAll('.cand-del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        candidates = candidates.filter(c=>c.id !== btn.dataset.id);
        await persistCandidates();
        renderLedger();
        showToast('Candidate removed');
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // ---------- Requirement profile editing ----------
  document.getElementById('newJobBtn').addEventListener('click', ()=>{
    editingJobId = 'new';
    renderReqEditor();
  });

  document.getElementById('saveJobBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('f_jobTitle').value.trim();
    const keywords = parseKeywords(document.getElementById('f_keywords').value);
    if(!title || keywords.length === 0){
      showToast('Enter a title and at least one keyword');
      return;
    }
    if(editingJobId === 'new'){
      const job = { id: uid('job'), title, keywords };
      jobs.push(job);
      activeJobId = job.id;
      showToast('Requirement profile created');
    } else {
      const idx = jobs.findIndex(j=>j.id === editingJobId);
      jobs[idx] = { ...jobs[idx], title, keywords };
      showToast('Requirement profile updated');
    }
    editingJobId = null;
    await persistJobs();
    render();
  });

  // allow editing existing profile via double click
  document.getElementById('jobList').addEventListener('dblclick', (e)=>{
    const chip = e.target.closest('.job-chip');
    if(chip){ editingJobId = chip.dataset.id; renderReqEditor(); }
  });

  // ---------- Search / filters ----------
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value.trim().toLowerCase();
    renderLedger();
  });

  // ---------- Upload handling ----------
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  dropzone.addEventListener('click', ()=> fileInput.click());
  dropzone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e)=>{
    e.preventDefault(); dropzone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e)=> handleFiles(e.target.files));

  function nameFromFile(fileName){
    return fileName.replace(/\.(pdf|txt)$/i,'').replace(/[_\-]+/g,' ').trim();
  }

  async function extractPdfText(arrayBuffer){
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n';
    }
    return text;
  }

  async function handleFiles(fileList){
    const job = activeJob();
    if(!job){
      showToast('Create a requirement profile first');
      return;
    }
    const files = Array.from(fileList);
    const statusEl = document.getElementById('uploadStatus');
    statusEl.innerHTML = files.map(f=>`<div class="line" data-file="${escapeHtml(f.name)}"><span>${escapeHtml(f.name)}</span><span>reading…</span></div>`).join('');

    for(const file of files){
      try {
        let text = '';
        if(/\.pdf$/i.test(file.name)){
          const buf = await file.arrayBuffer();
          text = await extractPdfText(buf);
        } else {
          text = await file.text();
        }
        candidates.push({
          id: uid('cand'),
          jobId: job.id,
          name: nameFromFile(file.name),
          fileName: file.name,
          text: text,
          uploadedAt: new Date().toISOString().slice(0,10),
        });
        const lineEl = statusEl.querySelector(`.line[data-file="${CSS.escape(file.name)}"]`);
        if(lineEl) lineEl.querySelector('span:last-child').textContent = 'added ✓';
      } catch(err){
        const lineEl = statusEl.querySelector(`.line[data-file="${CSS.escape(file.name)}"]`);
        if(lineEl) lineEl.querySelector('span:last-child').textContent = 'failed';
      }
    }
    await persistCandidates();
    render();
    fileInput.value = '';
    setTimeout(()=>{ statusEl.innerHTML=''; }, 3000);
  }

  loadAll();
})();
</script>
</body>
</html>
